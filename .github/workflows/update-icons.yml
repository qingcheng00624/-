name: 自动更新图标库

on:
  push:
    branches:
      - main
    paths:
      - "icons/**"
      - ".github/workflows/update-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-icons-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v6
        with:
          ref: main

      - name: 只扫描 icons 文件夹并生成 JSON
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import PurePosixPath
          from urllib.parse import quote

          # 图片直链的基础地址，自动读取当前仓库名称
          base_url = (
              "https://raw.githubusercontent.com/"
              + os.environ["GITHUB_REPOSITORY"]
              + "/main/"
          )

          # 只获取仓库根目录 icons 文件夹及其子文件夹内的文件
          files = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "icons/"]
          ).decode("utf-8").split("\0")

          image_extensions = {
              ".png", ".jpg", ".jpeg", ".webp", ".gif"
          }

          icons = []

          for file in sorted(files):
              path = PurePosixPath(file)

              if path.suffix.lower() not in image_extensions:
                  continue

              icons.append({
                  "name": path.stem,
                  "url": base_url + quote(file, safe="/")
              })

          data = {
              "name": "我的图标库",
              "description": "自动收录 icons 文件夹内的图标",
              "icons": icons
          }

          # 将图标清单保存到仓库根目录
          with open("icons.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"已生成 icons.json，共 {len(icons)} 个图标。")
          PY

      - name: 保存图标清单到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add icons.json

          if git diff --cached --quiet; then
            echo "图标清单没有变化，无需提交。"
            exit 0
          fi

          git commit -m "自动更新图标清单"
          git push origin HEAD:main
